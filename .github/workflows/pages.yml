name: Deploy demo

on:
  workflow_dispatch:
    inputs:
      recovery_run_id:
        description: 'Prior successful original Pages run; leave all recovery inputs empty for a new build'
        type: string
        default: ''
      recovery_artifact_id:
        description: 'Reviewed immutable github-pages artifact ID'
        type: string
        default: ''
      recovery_source_commit:
        description: 'Reviewed full source SHA of that original build'
        type: string
        default: ''
      recovery_archive_digest:
        description: 'Reviewed provider ZIP digest (sha256:...)'
        type: string
        default: ''
      recovery_tar_sha256:
        description: 'Independently reviewed original artifact.tar SHA256'
        type: string
        default: ''

      recovery_backup_release_id:
        description: 'Reviewed maintainer-only draft backup release ID; leave legacy recovery fields empty'
        type: string
        default: ''
      recovery_backup_manifest_sha256:
        description: 'Independently reviewed draft backup manifest SHA256'
        type: string
        default: ''

permissions:
  contents: read
  pages: read
  actions: read

concurrency:
  group: banora-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == '0disoft/banora' && github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact_id: ${{ steps.original.outputs.artifact_id || steps.restored.outputs['artifact-id'] || steps.durable.outputs['artifact-id'] }}
      tar_sha256: ${{ steps.fingerprint.outputs.tar_sha256 || steps.backup.outputs.tar_sha256 || inputs.recovery_tar_sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.x
      - name: Reject incomplete or conflicting recovery selection
        env:
          BANORA_RECOVERY_RUN: ${{ inputs.recovery_run_id }}
          BANORA_RECOVERY_ARTIFACT: ${{ inputs.recovery_artifact_id }}
          BANORA_RECOVERY_SOURCE: ${{ inputs.recovery_source_commit }}
          BANORA_RECOVERY_DIGEST: ${{ inputs.recovery_archive_digest }}
          BANORA_RECOVERY_TAR: ${{ inputs.recovery_tar_sha256 }}
          BANORA_BACKUP_RELEASE: ${{ inputs.recovery_backup_release_id }}
          BANORA_BACKUP_MANIFEST: ${{ inputs.recovery_backup_manifest_sha256 }}
        run: |
          if test -n "$BANORA_RECOVERY_RUN"; then
            test -z "$BANORA_BACKUP_RELEASE$BANORA_BACKUP_MANIFEST"
            test -n "$BANORA_RECOVERY_ARTIFACT" && test -n "$BANORA_RECOVERY_SOURCE" && test -n "$BANORA_RECOVERY_DIGEST" && test -n "$BANORA_RECOVERY_TAR"
          elif test -n "$BANORA_BACKUP_RELEASE"; then
            test -n "$BANORA_BACKUP_MANIFEST"
            test -z "$BANORA_RECOVERY_ARTIFACT$BANORA_RECOVERY_SOURCE$BANORA_RECOVERY_DIGEST$BANORA_RECOVERY_TAR"
          else
            test -z "$BANORA_RECOVERY_ARTIFACT$BANORA_RECOVERY_SOURCE$BANORA_RECOVERY_DIGEST$BANORA_RECOVERY_TAR$BANORA_BACKUP_MANIFEST"
          fi
      - uses: actions/setup-node@v7
        if: inputs.recovery_run_id == '' && inputs.recovery_backup_release_id == ''
        with:
          node-version-file: mise.toml
          package-manager-cache: false
      - name: Install reviewed dependencies
        if: inputs.recovery_run_id == '' && inputs.recovery_backup_release_id == ''
        run: bun run setup
      - name: Check workflow and file signals
        run: bun run security:files
      - uses: actions/configure-pages@v6
        if: inputs.recovery_run_id == '' && inputs.recovery_backup_release_id == ''
      - name: Build static examples
        if: inputs.recovery_run_id == '' && inputs.recovery_backup_release_id == ''
        run: bun run build:examples
      - name: Record public build identity
        if: inputs.recovery_run_id == '' && inputs.recovery_backup_release_id == ''
        run: |
          bun -e 'await Bun.write("dist/examples/banora-build.json", JSON.stringify({ schemaVersion: "banora.demo-build/v1", sourceCommit: process.env.GITHUB_SHA, sourceRunId: process.env.GITHUB_RUN_ID }) + "\n")'
      - uses: actions/upload-pages-artifact@v5
        id: original
        if: inputs.recovery_run_id == '' && inputs.recovery_backup_release_id == ''
        with:
          path: dist/examples
          retention-days: 14
      - name: Fingerprint the original built tar
        if: inputs.recovery_run_id == '' && inputs.recovery_backup_release_id == ''
        id: fingerprint
        env:
          BANORA_REPOSITORY_PUBLIC: 'true'
        run: |
          bun scripts/demo-health.ts fingerprint --archive "$RUNNER_TEMP/artifact.tar"
      - name: Validate original recovery candidate
        if: inputs.recovery_run_id != ''
        id: recovery
        env:
          GH_TOKEN: ${{ github.token }}
          BANORA_REPOSITORY_PUBLIC: 'true'
          BANORA_RECOVERY_RUN: ${{ inputs.recovery_run_id }}
          BANORA_RECOVERY_ARTIFACT: ${{ inputs.recovery_artifact_id }}
          BANORA_RECOVERY_SOURCE: ${{ inputs.recovery_source_commit }}
          BANORA_RECOVERY_DIGEST: ${{ inputs.recovery_archive_digest }}
        run: |
          bun scripts/demo-recovery.ts candidate --run-id "$BANORA_RECOVERY_RUN" --artifact-id "$BANORA_RECOVERY_ARTIFACT" --source-commit "$BANORA_RECOVERY_SOURCE" --archive-digest "$BANORA_RECOVERY_DIGEST"
      - name: Download exactly the reviewed original artifact
        if: inputs.recovery_run_id != ''
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.recovery.outputs.artifact_id }}
          run-id: ${{ inputs.recovery_run_id }}
          repository: 0disoft/banora
          github-token: ${{ github.token }}
          path: .artifacts/demo-recovery
          merge-multiple: true
      - name: Verify original tar bytes without extraction
        if: inputs.recovery_run_id != ''
        env:
          BANORA_REPOSITORY_PUBLIC: 'true'
          BANORA_RECOVERY_TAR: ${{ inputs.recovery_tar_sha256 }}
        run: |
          bun scripts/demo-recovery.ts archive --directory .artifacts/demo-recovery --sha256 "$BANORA_RECOVERY_TAR"
      - name: Retain original verified tar for deployment
        if: inputs.recovery_run_id != ''
        id: restored
        uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: .artifacts/demo-recovery/artifact.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Restore reviewed draft backup without original Actions access
        if: inputs.recovery_backup_release_id != '' && inputs.recovery_run_id == ''
        id: backup
        env:
          GH_TOKEN: ${{ github.token }}
          BANORA_REPOSITORY_PUBLIC: 'true'
          BANORA_BACKUP_RELEASE: ${{ inputs.recovery_backup_release_id }}
          BANORA_BACKUP_MANIFEST: ${{ inputs.recovery_backup_manifest_sha256 }}
        run: |
          mkdir -p .artifacts
          bun scripts/demo-backup.ts restore --release-id "$BANORA_BACKUP_RELEASE" --manifest-sha256 "$BANORA_BACKUP_MANIFEST"
      - name: Retain verified draft tar for deployment
        if: inputs.recovery_backup_release_id != '' && inputs.recovery_run_id == ''
        id: durable
        uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: ${{ steps.backup.outputs.directory }}/artifact.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  deploy:
    needs: build
    if: github.repository == '0disoft/banora' && github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static artifact
        id: deployment
        uses: actions/deploy-pages@v5

  health:
    needs: [build, deploy]
    if: github.repository == '0disoft/banora' && github.ref == 'refs/heads/main' && github.event.repository.private == false && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.x
      - name: Download the exact deployed artifact
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: .artifacts/demo-health
          merge-multiple: true
      - name: Check live file bytes against the deployed tar
        env:
          BANORA_DEPLOYED_TAR: ${{ needs.build.outputs.tar_sha256 }}
        run: |
          bun scripts/demo-health.ts check --directory .artifacts/demo-health --sha256 "$BANORA_DEPLOYED_TAR" --receipt .artifacts/demo-health-receipt.json
      - name: Preserve successful or failed live health receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: banora-demo-health
          path: .artifacts/demo-health-receipt.json
          if-no-files-found: ignore
          retention-days: 14

  archive:
    needs: [build, health]
    if: github.repository == '0disoft/banora' && github.ref == 'refs/heads/main' && github.event.repository.private == false && needs.health.result == 'success' && inputs.recovery_run_id == '' && inputs.recovery_backup_release_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.x
      - name: Check workflow and file signals
        run: bun run security:files
      - name: Download the exact successful original artifact
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: .artifacts/demo-archive
          merge-multiple: true
      - name: Preserve original bytes as a maintainer-only draft backup
        env:
          GH_TOKEN: ${{ github.token }}
          BANORA_REPOSITORY_PUBLIC: 'true'
          BANORA_BACKUP_JOB: archive
          BANORA_BACKUP_TAR: ${{ needs.build.outputs.tar_sha256 }}
        run: |
          bun scripts/demo-backup.ts capture --directory .artifacts/demo-archive --sha256 "$BANORA_BACKUP_TAR" --source-commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --execute
