name: Deploy demo

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: banora-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == '0disoft/banora' && github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.x
      - uses: actions/setup-node@v7
        with:
          node-version-file: mise.toml
          package-manager-cache: false
      - name: Install reviewed dependencies
        run: bun run setup
      - name: Check workflow and file signals
        run: bun run security:files
      - uses: actions/configure-pages@v6
      - name: Build static examples
        run: bun run build:examples
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/examples
          retention-days: 1

  deploy:
    needs: build
    if: github.repository == '0disoft/banora' && github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static artifact
        id: deployment
        uses: actions/deploy-pages@v5
