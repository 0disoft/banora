name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 8 1 * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.x
      - uses: actions/setup-node@v7
        with:
          node-version-file: mise.toml
          package-manager-cache: false
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun1-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun1-${{ runner.os }}-
      - name: Install reviewed dependencies
        run: bun run setup
      - name: Determine affected checks
        id: plan
        if: github.event_name != 'schedule'
        run: bun run ci:plan --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Install browser when required
        if: steps.plan.outputs.browser == 'true'
        run: bun run playwright-cli install-browser chrome --with-deps
      - name: Run affected checks
        if: github.event_name != 'schedule'
        run: bun run ci:run --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Monthly security signals and dependency audit
        if: github.event_name == 'schedule'
        run: bun run security:files && bun run security:deps
